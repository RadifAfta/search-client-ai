<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="radarSweep" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.08"/>
    </linearGradient>
    <radialGradient id="targetGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="70%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </radialGradient>
  </defs>

  <!-- Cockpit Squircle Frame -->
  <rect width="32" height="32" rx="7.5" fill="#0B0F17"/>
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="6.75" fill="none" stroke="#222D42" stroke-width="1.5"/>

  <!-- Concentric Radar Rings -->
  <circle cx="16" cy="16" r="11" fill="none" stroke="#1E293B" stroke-width="1.2"/>
  <circle cx="16" cy="16" r="6" fill="none" stroke="#222D42" stroke-width="1"/>

  <!-- Tactical Crosshair Notches -->
  <line x1="16" y1="2" x2="16" y2="6.5" stroke="#33415E" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="16" y1="25.5" x2="16" y2="30" stroke="#33415E" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="2" y1="16" x2="6.5" y2="16" stroke="#33415E" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="25.5" y1="16" x2="30" y2="16" stroke="#33415E" stroke-width="1.5" stroke-linecap="round"/>

  <!-- 90-degree Active Radar Sweep Beam (Upper-Right Quadrant) -->
  <path d="M 16 16 L 27 16 A 11 11 0 0 0 16 5 Z" fill="url(#radarSweep)"/>
  <line x1="16" y1="16" x2="27" y2="16" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Detected Lead Target Lock (Emerald Blip) -->
  <circle cx="21.5" cy="10.5" r="1.5" fill="#10B981"/>
  <circle cx="21.5" cy="10.5" r="3" fill="none" stroke="#10B981" stroke-width="0.7" opacity="0.6"/>

  <!-- Center Telemetry Reticle Point -->
  <circle cx="16" cy="16" r="2.5" fill="url(#targetGlow)"/>
  <circle cx="16" cy="16" r="4.2" fill="none" stroke="#F59E0B" stroke-width="0.8" opacity="0.7"/>
</svg>
